<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Desktop</title>

    <!-- Adds a small icon to the browser tab -->
    <link rel="icon" href="assets/">

    <meta name="author" content="your name">
    <meta name="copyright" content="your name, student project, 2026">

    <link rel="stylesheet" href="styles.css">


    <!-- Loads Google Fonts for use in the CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Loads Font Awesome, a library of ready-made icons -->

</head>

<body>
    <div id="main">
        <h1></h1>
    </div>

    <!-- THE LOGIN WINDOW-->

    <div id="login-window">

        <!-- title bar containing the blue bar and text-->
        <div class="title-bar">

            <h3>System Login</h3>






        </div>

        <div class="login-window-buttons">


            <!-- LOGIN BUTTON-->
            <button class="win-button">Login</button>

            <!-- CLOSE BUTTON-->
            <!-- IDEA TO TURN HACKER MODE IF ITS CLICKED-->
            <button class="win-button closeButton">X</button>
        </div>

        <div class="window-content">
            <h1>Welcome!</h1>

            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">



        </div>
    </div>

</body>

</html>
