    <!-- TASK BAR -->
    <div id="task-bar">

        <img class="startImg" src="../assets/images/startnew.png"" alt=" Start button">


        <!-- SHOULD START HERE AND MAKE CLOCK WORK BEFORE MOViNG ON-->
        <div id="clock"></div>


    </div>
    <div id="digiC"></div>

    <script>
        function startTime() {
            const today = new Date();
            let h = today.getHours();
            let m = today.getMinutes();
            let s = today.getSeconds();
            m = checkTime(m);
            s = checkTime(s);
            document.getElementById('digiC').innerHTML = h + ":" + m + ":" + s;
            setTimeout(startTime, 1000);
        }

        function checkTime(i) {
            if (i < 10) { i = "0" + i };  // add zero in front of numbers < 10
            return i;
        }
    </script>
